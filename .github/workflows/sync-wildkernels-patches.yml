name: Sync WildKernels A556B source patches

# jimsterino maintains the Samsung sources in WildKernels/Samsung_Kernels, one branch per
# device, with a few of his own commits on top of each Samsung import. His tree cannot be
# merged into der-meddler/A556B-source (different git history, kernel under kernel/), so
# his edits are carried as patches/a556b/*.patch and applied at build time.
#
# scripts/wk-patch-sync.sh regenerates that set as the NET change between his last Samsung
# import and his branch tip, one patch per file (so an edit he adds and later reverts
# cancels out instead of producing a patch that can never apply), minus his BUILD_NUMBER
# edit (the source action derives it from the source tag). It applies both the current and
# the regenerated set to A556B-source the way the build does and compares the results.
#   unchanged                       job passes, nothing else happens
#   changed, new set applies        a pull request replaces patches/a556b
#   new set does not apply          job fails: needs a human (new hotfix drop, conflict)
# Run the same thing locally with:  WORK=/tmp/wksync scripts/wk-patch-sync.sh

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: WildKernels/Samsung_Kernels branch to read
        type: string
        default: SM-A556B-Oneui7

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WK_BRANCH: ${{ inputs.branch || 'SM-A556B-Oneui7' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Regenerate and compare the patch set
        id: sync
        run: |
          # outside the checkout, so the clones never end up in the pull request
          echo "WORK=$RUNNER_TEMP/wk-sync" >> "$GITHUB_ENV"
          WORK="$RUNNER_TEMP/wk-sync" bash scripts/wk-patch-sync.sh

      - name: Open a pull request
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync/wildkernels-patches-${{ github.run_id }}"
          git checkout -q -b "$branch"
          rm -f patches/a556b/*.patch
          cp "$WORK"/new-patches/*.patch patches/a556b/ 2>/dev/null || true
          git add -A patches/a556b
          git commit -q -m "patches/a556b: refresh from WildKernels $WK_BRANCH" -m "$(cat "$WORK/report.md")"
          git push -q origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Refresh A556B source patches from WildKernels $WK_BRANCH" \
            --body-file "$WORK/report.md"

      - name: Summary
        if: ${{ always() }}
        run: |
          { echo "## WildKernels/Samsung_Kernels $WK_BRANCH"; echo
            cat "$WORK/report.md" 2>/dev/null || echo "no report (the script stopped early, see its log)"
            echo; echo "patch set changed: ${{ steps.sync.outputs.changed || 'n/a' }}"; } >> "$GITHUB_STEP_SUMMARY"
