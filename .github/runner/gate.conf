# systemd drop-in for the AUR github-actions-bin runner service, installed to
# /etc/systemd/system/github-actions.service.d/gate.conf. Set here and not in the
# runner's .env, which the job user can write.
[Service]
Environment=ACTIONS_RUNNER_HOOK_JOB_STARTED=/etc/github-actions/job-started-gate.sh
